<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1b244a" />
    <title>Basketball Scoreboard</title>
    <link rel="stylesheet" href="index.css" />
    <link
      href="https://fonts.cdnfonts.com/css/cursed-timer-ulil"
      rel="stylesheet"
    />
    <link href="https://fonts.cdnfonts.com/css/verdana" rel="stylesheet" />
  </head>
  <body>
    <main class="container" aria-label="Basketball scoreboard">
      <h1 class="visually-hidden">Basketball scoreboard</h1>
      <div class="scoreboards">
        <section class="team" aria-labelledby="home-heading">
          <h2 id="home-heading">HOME</h2>
          <div class="score"><p id="home-score" aria-live="polite" aria-atomic="true">0</p></div>
          <div class="score-controls" role="group" aria-label="Add points to home">
            <button onclick="oneHome()">+1</button>
            <button onclick="twoHome()">+2</button>
            <button onclick="threeHome()">+3</button>
          </div>
        </section>
        <section class="team" aria-labelledby="guest-heading">
          <h2 id="guest-heading">AWAY</h2>
          <div class="score"><p id="guest-score" aria-live="polite" aria-atomic="true">0</p></div>
          <div class="score-controls" role="group" aria-label="Add points to away">
            <button onclick="oneGuest()">+1</button>
            <button onclick="twoGuest()">+2</button>
            <button onclick="threeGuest()">+3</button>
          </div>
        </section>
      </div>
      <button id="reset" onclick="reset()">RESET</button>
    </main>
    <script src="index.js"></script>
  </body>
</html>
